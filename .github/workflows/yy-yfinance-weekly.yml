name: YY yfinance weekly collection

on:
  workflow_dispatch:

  schedule:
    # Friday 14:30 UTC = Friday 23:30 JST.
    - cron: '30 14 * * 5'

permissions:
  contents: write

concurrency:
  group: yy-yfinance-weekly
  cancel-in-progress: false

jobs:
  refresh_universe:
    name: Refresh JPX universe
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh Prime / Standard / Growth universe
        run: |
          python scripts/refresh_jpx_universe.py

      - name: Validate refreshed universe
        run: |
          COUNT=$(grep -cve '^[[:space:]]*$' input.lst)
          echo "JPX universe count: ${COUNT}"

          if [ "$COUNT" -lt 3000 ]; then
            echo "Universe count is abnormally small."
            exit 1
          fi

          if [ "$COUNT" -gt 5000 ]; then
            echo "Universe count is abnormally large."
            exit 1
          fi

          echo "=== First 20 ==="
          head -20 input.lst
          echo "=== Last 20 ==="
          tail -20 input.lst

      - name: Upload refreshed universe
        uses: actions/upload-artifact@v7
        with:
          name: yy-jpx-universe
          path: |
            input.lst
            data/universe/jpx_universe_latest.csv
          if-no-files-found: error
          retention-days: 7

  collect:
    name: Collect shard ${{ matrix.shard }}
    needs: refresh_universe
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download refreshed JPX universe
        uses: actions/download-artifact@v7
        with:
          name: yy-jpx-universe
          path: universe

      - name: Replace input.lst with refreshed universe
        run: |
          cp universe/input.lst input.lst
          echo "Refreshed universe count:"
          grep -cve '^[[:space:]]*$' input.lst

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect yfinance data
        run: |
          mkdir -p shards
          python scripts/collect_shard.py \
            --input input.lst \
            --shard-index ${{ matrix.shard }} \
            --shard-count 8 \
            --output shards/shard_${{ matrix.shard }}.csv

      - name: Upload shard
        uses: actions/upload-artifact@v7
        with:
          name: yy-shard-${{ matrix.shard }}
          path: shards/shard_${{ matrix.shard }}.csv
          if-no-files-found: error
          retention-days: 3

  merge:
    name: Merge and publish latest
    needs:
      - refresh_universe
      - collect
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download refreshed JPX universe
        uses: actions/download-artifact@v7
        with:
          name: yy-jpx-universe
          path: universe

      - name: Replace input.lst with refreshed universe
        run: |
          cp universe/input.lst input.lst
          mkdir -p data/universe
          cp universe/data/universe/jpx_universe_latest.csv data/universe/jpx_universe_latest.csv

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install merge dependency
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Download all shards
        uses: actions/download-artifact@v7
        with:
          pattern: yy-shard-*
          path: shards
          merge-multiple: true

      - name: Show downloaded shards
        run: |
          echo "=== Downloaded shard files ==="
          find shards -maxdepth 2 -type f -print | sort

      - name: Merge shards and validate
        run: |
          EXPECTED=$(grep -cve '^[[:space:]]*$' input.lst)
          echo "Expected stock count: ${EXPECTED}"

          python scripts/merge_shards.py \
            --shards-dir shards \
            --latest-dir data/latest \
            --expected-count "$EXPECTED" \
            --max-error-rate 0.25

      - name: Verify merged files
        run: |
          echo "=== data/latest contents ==="
          ls -lah data/latest

          test -f data/latest/yy_market_data_latest.csv
          test -f data/latest/yy_market_data_latest.meta.json
          test -f data/universe/jpx_universe_latest.csv

          echo "=== CSV row count ==="
          python - <<'PY'
          import pandas as pd

          path = "data/latest/yy_market_data_latest.csv"
          df = pd.read_csv(path)
          print(f"rows={len(df)}")
          print(f"columns={len(df.columns)}")
          print(df.head(3).to_string(index=False))
          PY

          echo "=== Metadata ==="
          cat data/latest/yy_market_data_latest.meta.json

      - name: Upload merged snapshot
        uses: actions/upload-artifact@v7
        with:
          name: yy-market-data-${{ github.run_id }}
          path: |
            input.lst
            data/universe/jpx_universe_latest.csv
            data/latest/yy_market_data_latest.csv
            data/latest/yy_market_data_latest.meta.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit latest data and JPX universe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            input.lst \
            data/universe/jpx_universe_latest.csv \
            data/latest/yy_market_data_latest.csv \
            data/latest/yy_market_data_latest.meta.json

          echo "=== Git status after git add ==="
          git status --short

          if git diff --cached --quiet; then
            echo "No data change to commit."
            exit 0
          fi

          git commit -m "data: refresh JPX universe and YY market snapshot"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
