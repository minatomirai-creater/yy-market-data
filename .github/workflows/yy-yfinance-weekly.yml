name: YY yfinance weekly collection

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Friday 19:00 UTC = Saturday 04:00 JST.
    # YY Weekly IC runs Saturday 08:00 JST, leaving a 4-hour buffer.
    - cron: '0 19 * * 5'

permissions:
  contents: write

concurrency:
  group: yy-yfinance-weekly
  cancel-in-progress: false

jobs:
  collect:
    name: Collect shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect yfinance data
        run: |
          mkdir -p shards
          python scripts/collect_shard.py \
            --input input.lst \
            --shard-index ${{ matrix.shard }} \
            --shard-count 8 \
            --output shards/shard_${{ matrix.shard }}.csv

      - name: Upload shard
        uses: actions/upload-artifact@v7
        with:
          name: yy-shard-${{ matrix.shard }}
          path: shards/shard_${{ matrix.shard }}.csv
          if-no-files-found: error
          retention-days: 3

  merge:
    name: Merge and publish latest
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install merge dependency
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Download all shards
        uses: actions/download-artifact@v7
        with:
          pattern: yy-shard-*
          path: shards
          merge-multiple: true

      - name: Merge shards and validate
        run: |
          EXPECTED=$(grep -cve '^\s*$' input.lst)
          python scripts/merge_shards.py \
            --shards-dir shards \
            --latest-dir data/latest \
            --expected-count "$EXPECTED" \
            --max-error-rate 0.25

      - name: Upload merged snapshot
        uses: actions/upload-artifact@v7
        with:
          name: yy-market-data-${{ github.run_id }}
          path: |
            data/latest/yy_market_data_latest.csv
            data/latest/yy_market_data_latest.meta.json
          if-no-files-found: error
          retention-days: 30

- name: Commit latest data
  run: |
    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    git add data/latest/yy_market_data_latest.csv \
            data/latest/yy_market_data_latest.meta.json

    if git diff --cached --quiet; then
      echo "No data change to commit."
      exit 0
    fi

    git commit -m "data: refresh YY yfinance weekly snapshot"
    git push
